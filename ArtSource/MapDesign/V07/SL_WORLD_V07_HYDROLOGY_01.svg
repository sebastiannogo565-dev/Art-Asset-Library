35557" >无大坝/巨大瀑布/码头；旧泉渠不是污水通道。湖岸环路与主河两城市桥空间独立。</text><text x="90" y="2515" font-size="20" fill="#335557" >本图与总平面来自同一JSON；未做水力、管线高程、坡度与三维地形验证。</text></svg>