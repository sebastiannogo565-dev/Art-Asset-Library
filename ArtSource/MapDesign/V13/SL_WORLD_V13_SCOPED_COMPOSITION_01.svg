_oldstreet_facade" data-purpose="保留旧店屋体量，仅店檐/顾客窗/门面片段" clip-path="url(#04_oldstreet_facade_clip)"><image width="1374" height="1145" href="SL_WORLD_V13_SCOPE_RESTRICTED_01.png"/></g><g id="05_station_pedestrian" data-purpose="既有站前步行与侧候车边缘，不改轨道站场" clip-path="url(#05_station_pedestrian_clip)"><image width="1374" height="1145" href="SL_WORLD_V13_SCOPE_RESTRICTED_01.png"/></g><g id="06_estuary_shoals" data-purpose="低缓沙洲浅滩与主槽；保留原桥/岸路/两岸住宅" clip-path="url(#06_estuary_shoals_clip)"><image width="1374" height="1145" href="SL_WORLD_V13_SCOPE_RESTRICTED_01.png"/></g><g id="06_small_fishery_facade" data-purpose="原作业岸的克制楼体/门窗及整理，不动泊位/堤/灯塔" clip-path="url(#06_small_fishery_facade_clip)"><image width="1374" height="1145" href="SL_WORLD_V13_SCOPE_RESTRICTED_01.png"/></g><g id="07_beach_service_edge" data-purpose="原入口服务与少量活动；不改岸形、不加河/桥/农田" clip-path="url(#07_beach_service_edge_clip)"><image width="1374" height="1145" href="SL_WORLD_V13_SCOPE_RESTRICTED_01.png"/></g></g></svg>