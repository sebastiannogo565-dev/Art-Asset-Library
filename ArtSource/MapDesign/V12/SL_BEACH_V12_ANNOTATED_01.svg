<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941"><style>text{font-family:Microsoft YaHei,Arial,sans-serif}</style><image width="1672" height="941" href="Originals/SL_BEACH_V12_VIEW_01.png"/><g id="editable_chinese_review"><rect width="1672" height="36" fill="#f5f1e7" fill-opacity=".94"/><text x="15" y="25" font-size="17" fill="#345b55">SL_BEACH_V12_VIEW_01 / 1672×941原生 · 视觉候选未批准</text><rect y="846" width="1672" height="95" fill="#f5f1e7" fill-opacity=".96"/><text x="15" y="868" font-size="16" fill="#345b55">原入口/陆侧棚和洗脚：只表现候选用途；服务位置以定尺图为准</text><text x="15" y="895" font-size="16" fill="#345b55">偏差：新增河/桥/农田；人物偏高头身；主图不采纳这些空间</text><text x="15" y="922" font-size="16" fill="#345b55">原夏日2伞少人，未重抽；实际坡度/救生/供水/游戏均未验证</text></g></svg>