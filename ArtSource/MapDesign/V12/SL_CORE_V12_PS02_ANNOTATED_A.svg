<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941"><style>text{font-family:Microsoft YaHei,Arial,sans-serif}</style><image width="1672" height="941" href="Originals/SL_CORE_V12_PS02_VIEW_A.png"/><g id="editable_chinese_review"><rect width="1672" height="36" fill="#f5f1e7" fill-opacity=".94"/><text x="15" y="25" font-size="17" fill="#345b55">SL_CORE_V12_PS02_VIEW_A / 1672×941原生 · 视觉候选未批准</text><rect y="846" width="1672" height="95" fill="#f5f1e7" fill-opacity=".96"/><text x="15" y="868" font-size="16" fill="#345b55">方向有切换，但同一建筑门面/屋顶/井距与泉渠未完整对应</text><text x="15" y="895" font-size="16" fill="#345b55">偏差：宽水渠/额外桥、农田与温室；原角色只读比例参照</text><text x="15" y="922" font-size="16" fill="#345b55">共享150×145m A/B体块才是准确依据，未把生成偏差写回</text></g></svg>