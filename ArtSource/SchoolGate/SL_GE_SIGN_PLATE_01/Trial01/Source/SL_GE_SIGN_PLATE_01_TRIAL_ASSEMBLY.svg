<text x="65" y="75" font-size="42" fill="#283d43">SL_GE_SIGN_PLATE_01 · Trial01 装配 / 锁定 / 拆卸补充</text>
<text x="65" y="120" font-size="25" fill="#283d43">先完成本说明，再生成网格。尺寸cm；示意工艺待核；非施工/锚固认证。</text>
