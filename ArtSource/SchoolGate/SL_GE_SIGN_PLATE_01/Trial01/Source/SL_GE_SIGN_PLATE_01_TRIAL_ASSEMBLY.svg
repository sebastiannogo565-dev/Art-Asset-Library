<text x="80" y="205" font-size="31" fill="#283d43">01 先固定柱侧座，再挂入牌体</text>
<rect x="223.0" y="210.0" width="174.0" height="580.0" rx="8" fill="#e1dfd4" stroke="#d4dedb" stroke-width="2"/>
