<text x="130.00" y="960.00" font-size="26" text-anchor="start">教学5°浅切妻：内墙檐12.30 / 脊13.0874；外挑0.60檐边12.2475。核心平屋面12.90 / 女儿墙13.00。</text>
<text x="130.00" y="1005.00" font-size="26" text-anchor="start">采光庭低脊玻璃顶最高13.65；连接12.30。檐沟南北排水，竖管在教学端柱；实际管径/坡降/排水工法待验。</text>
<text x="130.00" y="1050.00" font-size="26" text-anchor="start">露台完成面8.03：承载楼板FL8上30mm面层；历史Planning的8.25体块帽改为本次地面细化，门/高度接口须复核。</text>
