<text x="100.00" y="295.00" font-size="27" text-anchor="start">厅→主廊：新净3.0 / 原1.4；外门仍25/0、3.0</text>
<text x="100.00" y="1208.00" font-size="24" text-anchor="start">橙去 / 黄换鞋后等候 / 青离开；前端交叉点需让行</text>
<text x="1370.00" y="300.00" font-size="27" text-anchor="start">主厅96.90㎡：600格；补厅99.18㎡：300格</text>
<text x="1370.00" y="356.00" font-size="27" text-anchor="start">主6柜总深0.60，每面0.30，原0.70/0.35</text>
<text x="1370.00" y="412.00" font-size="27" text-anchor="start">补2柜深0.70不变；名义列/行/双面未减</text>
<text x="1370.00" y="468.00" font-size="27" text-anchor="start">主柜列名义净2.00，使用带0.70</text>
<text x="1370.00" y="524.00" font-size="27" text-anchor="start">余名义1.30 / 含柜面实余1.276</text>
<text x="1370.00" y="580.00" font-size="27" text-anchor="start">两侧操作实余0.576，不认定通过</text>
<text x="1370.00" y="636.00" font-size="27" text-anchor="start">垂直上移柜门候选，无向外门扇占道</text>
<text x="1370.00" y="692.00" font-size="27" text-anchor="start">主线3.00，去/回各1.50；内门同宽3.00</text>
<text x="1370.00" y="748.00" font-size="27" text-anchor="start">柜端1.20与东端0.40分别标，东端非通路</text>
<text x="1370.00" y="804.00" font-size="27" text-anchor="start">换鞋凳前移至y0.30–0.75，前操作区净1.25</text>
<text x="1370.00" y="860.00" font-size="27" text-anchor="start">等候在东侧28/1.375，队列不伸主中央线</text>
<text x="1370.00" y="916.00" font-size="27" text-anchor="start">前端去回交叉要让行；集中排队/运营未验</text>
<text x="1370.00" y="972.00" font-size="27" text-anchor="start">0.30深实际鞋长、滑门五金与两侧错时待审</text>
<text x="110.00" y="1400.00" font-size="29" text-anchor="start">补充柜列：2×15×5×2＝300；主：3×(12＋8)×5×2＝600，合900</text>
<text x="110.00" y="1490.00" font-size="28" text-anchor="start">正常到达：外门→西半主线→柜列通道→柜前；离开柜前回通道，再到东等候凹口。</text>
<text x="110.00" y="1554.00" font-size="28" text-anchor="start">主廊离开：东等候→东半主线→3m内廊口→y10.9；返回外门另经中央通道，交叉需让行。</text>
<text x="110.00" y="1618.00" font-size="28" text-anchor="start">指定柜面操作占位1.04宽×0.68深，位于0.70深使用带；不是能任意旋转的1.04m圆。</text>
<text x="110.00" y="1682.00" font-size="28" text-anchor="start">每条站立主线与静态家具/候选使用区分开核。内门无外摆扇；900是名义容量，不声称高峰集散通过。</text>
<text x="80.00" y="2335.00" font-size="23" text-anchor="start">C01 REFERENCE_01_REV_01 · 2026-10-15 · 单位m · 设计参考 / 共享简模预览；非最终贴图 / 非实际游戏效果</text>
