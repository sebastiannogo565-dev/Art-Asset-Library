<text x="2141.6000000000004" y="1392.8" font-size="27" fill="#233c42">实门1.40 / 候选2.40</text>
<text x="2589.6000000000004" y="401.60000000000014" font-size="25" fill="#233c42">等候6位→</text>
<text x="1660.0" y="1387.2" font-size="25" fill="#233c42">净范围 11.40 × 8.70m / 北↑</text>
<text x="100" y="1480" font-size="29" fill="#233c42">柜间净面距2.52m；双操作0.70+公共1.12+0.70m。</text>
<text x="100" y="1532" font-size="29" fill="#233c42">主厅三对：西3.00m×10列，东0.90m×3列。</text>
<text x="100" y="1584" font-size="29" fill="#233c42">六层×双面：每对156格；主厅合468格。</text>
<text x="100" y="1636" font-size="29" fill="#233c42">单列深0.64m，有效腔深0.304m；开放格候选。</text>
<text x="100" y="1688" font-size="29" fill="#233c42">主厅柜端绕行≥1.12m；两条同时路径最小余量13.08mm。</text>
<text x="100" y="1740" font-size="29" fill="#233c42">主厅不设排队；原两凳移除，不宣称实际换鞋动作已验。</text>
<text x="1650" y="1480" font-size="29" fill="#233c42">西连接：单面16列×6=96；双面14×6×2×2=336。</text>
<text x="1650" y="1532" font-size="29" fill="#233c42">柜长4.8 / 4.2 / 4.2m；深0.35 / 0.70 / 0.70m。</text>
<text x="1650" y="1584" font-size="29" fill="#233c42">操作带外公共净1.12m；队列在东侧口袋，避开柜端。</text>
<text x="1650" y="1636" font-size="29" fill="#233c42">原1.4m内门：两个人物宽需2.07931m，差0.67931m。</text>
<text x="1650" y="1688" font-size="29" fill="#233c42">唯一推荐取舍：同中心内门扩至2.4m，交规划判断。</text>
<text x="1650" y="1740" font-size="29" fill="#233c42">虚线为2.4m候选路径；实际源和FBX仍保1.4m原门。</text>
<text x="100" y="1855" font-size="34" fill="#233c42">旧加深纠错（不覆盖原包）</text>
<text x="100" y="1910" font-size="30" fill="#233c42">18.00m × (0.66−0.60)m = 1.08㎡；10.80→11.88㎡，原0.54㎡错误。</text>
<text x="100" y="1970" font-size="30" fill="#233c42">新布局另算：主厅11.70×0.64=7.488㎡；西连接4.80×0.35+8.40×0.70=7.560㎡。</text>
<text x="100" y="2030" font-size="30" fill="#233c42">合计15.048㎡；原试作18.180㎡；变化−3.132㎡。柜体占地，不含操作/通路/等候带。</text>
<text x="100" y="2100" font-size="28" fill="#233c42">腔宽0.288m / 净口高0.276m；鞋290×105×115mm，双鞋宽235mm；新增手包络仅尺寸假设。</text>
<text x="100" y="2150" font-size="28" fill="#233c42">六层最上层底1.50m，取用点1.60m；假设臂长0.80m，静态需求0.766m。真实抓握/力、换鞋坐凳未验证。</text>
<text x="100" y="2200" font-size="28" fill="#233c42">证据覆盖有限指定同时使用者；不等于900人高峰或任意全柜取用通过。原门接口精作暂停，保900目标交审。</text>
