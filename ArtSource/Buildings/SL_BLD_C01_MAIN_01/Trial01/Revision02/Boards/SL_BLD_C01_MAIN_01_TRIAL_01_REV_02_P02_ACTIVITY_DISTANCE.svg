<text x="140" y="295.35000000000014" font-size="29" fill="#233c42">北↑ / 原门与30席、全部家具不动</text>
<text x="564.7000000000003" y="1644.7999999999997" font-size="25" fill="#233c42">原门1.60×2.60m</text>
<text x="1510" y="270" font-size="36" fill="#233c42">P / E Actor中心，A地点Actor锚点</text>
<text x="1510" y="335" font-size="28" fill="#233c42">G脚下 local(45,19.50,4.00)m。</text>
<text x="1510" y="382" font-size="28" fill="#233c42">候选UE工程G=(4500,7050,1200)cm。</text>
<text x="1510" y="429" font-size="28" fill="#233c42">P=E：Actor按默认+0.96m或示例+0.98m分别算。</text>
<text x="1510" y="476" font-size="28" fill="#233c42">P/E local Z=4.96 / 4.98，不是脚底或贴图中心。</text>
<text x="1510" y="523" font-size="28" fill="#233c42">历史A=(4500,7050,800)cm：仅历史Recipe。</text>
<text x="1510" y="570" font-size="28" fill="#233c42">正式A候选=(4500,7050,1200)cm：规划约定。</text>
<text x="1510" y="617" font-size="28" fill="#233c42">现用运行地图A/Actor变换、scaled半高尚未实测。</text>
<text x="1510" y="664" font-size="28" fill="#233c42">不得用正式Z1200冒充“现用原锚点”。</text>
<text x="1510" y="760" font-size="29" fill="#233c42">统一UE候选世界cm；每行 P=E 均分别验算</text>
<text x="1510" y="815" font-size="28" fill="#233c42">来源 / Actor偏移 ｜ d(cm) ｜ 230−d(cm) ｜ 条件</text>
<text x="1510" y="875" font-size="27" fill="#ae5450">历史Z800 / +0.96m ｜ 496.000 ｜ -266.000 ｜ 失败</text>
<text x="1510" y="931" font-size="27" fill="#ae5450">历史Z800 / +0.98m ｜ 498.000 ｜ -268.000 ｜ 失败</text>
<text x="1510" y="987" font-size="27" fill="#26835a">规划Z1200 / +0.96m ｜ 96.000 ｜ +134.000 ｜ 条件内</text>
<text x="1510" y="1043" font-size="27" fill="#26835a">规划Z1200 / +0.98m ｜ 98.000 ｜ +132.000 ｜ 条件内</text>
<text x="1510" y="1150" font-size="31" fill="#233c42">d=√((Px−Ax)²+(Py−Ay)²+(Pz−Az)²)</text>
<text x="1510" y="1200" font-size="28" fill="#233c42">平方比较≤52900；未舍入的实值见JSON/CSV。</text>
