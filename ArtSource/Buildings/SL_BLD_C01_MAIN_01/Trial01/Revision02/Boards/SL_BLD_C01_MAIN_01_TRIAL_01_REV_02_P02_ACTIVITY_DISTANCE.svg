<text x="110" y="1870" font-size="30" fill="#233c42">门口→横通道→操作点：全宽站立与胶囊检查最小分离0.21m。</text>
<text x="110" y="1931" font-size="30" fill="#233c42">3_5椅(46.175,19.87,4.43)仅关系候选，完整入座未通过/未验。</text>
<text x="110" y="1992" font-size="30" fill="#233c42">5_5及原19阶段不改、不重跑；不是最终绑定席。</text>
<text x="110" y="2053" font-size="30" fill="#233c42">预览/Enter在G操作点进行，不附加19阶段全过程在圈要求。</text>
<text x="110" y="2114" font-size="30" fill="#233c42">历史锚点若仍Z800：最小竖差496cm，超过230cm达266cm。</text>
<text x="110" y="2175" font-size="30" fill="#233c42">唯一推荐：暂停最终席绑定，交开发/规划只读核定现用变换再判断。</text>
<text x="110" y="2260" font-size="29" fill="#233c42">规划条件距离内 ≠ 当前工程兼容通过；资格/最近地点选择/地图变换/真实游戏仍未验证。</text>
<text x="80" y="2345" font-size="27" fill="#233c42">REV_02 · 同一 LAYOUT / ACTIVITY_DISTANCE 数据 · 米制几何、UE候选厘米分别标注 · 非游戏验收</text>
