<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2400" viewBox="0 0 3200 2400"><rect width="3200" height="2400" fill="#f0f3ef"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="80" y="90" font-size="46" fill="#30464a" text-anchor="start">C01 · 关键剖面 / 楼梯孔 / 整栋拆分</text><text x="80" y="145" font-size="25" fill="#30464a" text-anchor="start">层高4m，净高3.45m为设计候选；不作为现实施工合规、结构或消防结论。</text><text x="80" y="195" font-size="20" fill="#30464a" text-anchor="start">北向：平面N=+Y；立面朝向见图名 | 米制：平面比例尺，剖面按尺寸标注，体量不定尺 | 蓝=教学 / 黄=公共 / 棕=管理 / 橙=门</text><text x="80" y="2350" font-size="22" fill="#30464a" text-anchor="start">SL_BLD_C01_MAIN_01 / PLAN_01 / 2026-10-15 · 米制候选规划；非模型/工程/UE验收；B01状态保持</text><rect x="160" y="1112" width="1050" height="18" fill="#b3c0bc" stroke="#607c78" stroke-width="2"/><text x="170" y="1175" font-size="24" fill="#30464a" text-anchor="start">F01 +0 / 工程+8m</text><path d="M160,888 L1210,888" fill="none" stroke="#9db0ac" stroke-width="3"/><rect x="160" y="832" width="1050" height="18" fill="#b3c0bc" stroke="#607c78" stroke-width="2"/><text x="170" y="895" font-size="24" fill="#30464a" text-anchor="start">F02 +4 / 工程+12m</text><path d="M160,608 L1210,608" fill="none" stroke="#9db0ac" stroke-width="3"/><rect x="160" y="552" width="1050" height="18" fill="#b3c0bc" stroke="#607c78" stroke-width="2"/><text x="170" y="615" font-size="24" fill="#30464a" text-anchor="start">F03 +8 / 工程+16m</text><path d="M160,328 L1210,328" fill="none" stroke="#9db0ac" stroke-width="3"/><path d="M160,1130 L160,240" fill="none" stroke="#607c78" stroke-width="10"/><path d="M1210,1130 L1210,240" fill="none" stroke="#607c78" stroke-width="10"/><rect x="160" y="210" width="1050" height="25" fill="#90a3a0" stroke="#607c78" stroke-width="2"/><text x="180" y="1240" font-size="28" fill="#30464a" text-anchor="start">教学横剖：北9m教室—3.6m走廊—南服务/交流</text><text x="1450" y="300" font-size="25" fill="#30464a" text-anchor="start">采光庭：12×9=108㎡，三层通高</text><text x="1450" y="343" font-size="25" fill="#30464a" text-anchor="start">F02/F03楼板各减108㎡</text><text x="1450" y="386" font-size="25" fill="#30464a" text-anchor="start">边缘步台有讨论/等候，不放大树池</text><text x="1450" y="429" font-size="25" fill="#30464a" text-anchor="start">3层南角露台60㎡，不叠加新地标</text><text x="1450" y="472" font-size="25" fill="#30464a" text-anchor="start"></text><text x="1450" y="515" font-size="25" fill="#30464a" text-anchor="start">每层3座U梯，净跑2.2m</text><text x="1450" y="558" font-size="25" fill="#30464a" text-anchor="start">每层24踢步×0.166667=4m</text><text x="1450" y="601" font-size="25" fill="#30464a" text-anchor="start">每跑11踏面×0.3=3.3m</text><text x="1450" y="644" font-size="25" fill="#30464a" text-anchor="start">梯洞4.7×5.5=25.85㎡/座</text><text x="1450" y="687" font-size="25" fill="#30464a" text-anchor="start">F02/F03各扣77.55㎡</text><text x="1450" y="730" font-size="25" fill="#30464a" text-anchor="start">每层下方顶面也同位开孔</text><text x="1450" y="773" font-size="25" fill="#30464a" text-anchor="start">电梯井2.4×2.4，操作系统未定</text><polyline points="180,2070 210,2070.0 210,2053.3333333333335 240,2053.3333333333335 240,2036.6666666666667 270,2036.6666666666667 270,2020.0 300,2020.0 300,2003.3333333333333 330,2003.3333333333333 330,1986.6666666666667 360,1986.6666666666667 360,1970.0 390,1970.0 390,1953.3333333333333 420,1953.3333333333333 420,1936.6666666666667 450,1936.6666666666667 450,1920.0 480,1920.0 480,1903.3333333333333 510,1903.3333333333333 510,1886.6666666666667 540,1886.6666666666667 540,1870.0 570,1870.0 570,1853.3333333333333 600,1853.3333333333333 600,1836.6666666666667 630,1836.6666666666667 630,1820.0 660,1820.0 660,1803.3333333333335 690,1803.3333333333335 690,1786.6666666666667 720,1786.6666666666667 720,1770.0 750,1770.0 750,1753.3333333333335 780,1753.3333333333335 780,1736.6666666666667 810,1736.6666666666667 810,1720.0 840,1720.0 840,1703.3333333333335 870,1703.3333333333335 870,1686.6666666666667 900,1686.6666666666667 900,1670.0" fill="none" stroke="#648a82" stroke-width="5"/><text x="160" y="1480" font-size="27" fill="#30464a" text-anchor="start">U梯展开剖面示意 / 实际两跑位置不同；本图不是一条直梯</text><path d="M180,1770 L480,1770" fill="none" stroke="#a07d58" stroke-width="3" stroke-dasharray="10,8"/><text x="180" y="1740" font-size="23" fill="#30464a" text-anchor="start">对应顶面必须开洞</text><rect x="1450" y="1370" width="1020" height="9" fill="#c5cec5" stroke="#8b9b98" stroke-width="2"/><rect x="1450" y="1234" width="340" height="9" fill="#c5cec5" stroke="#8b9b98" stroke-width="2"/><rect x="2198" y="1234" width="272" height="9" fill="#c5cec5" stroke="#8b9b98" stroke-width="2"/><rect x="1450" y="1098" width="340" height="9" fill="#c5cec5" stroke="#8b9b98" stroke-width="2"/><rect x="2198" y="1098" width="272" height="9" fill="#c5cec5" stroke="#8b9b98" stroke-width="2"/><rect x="1450" y="955" width="1020" height="10" fill="#abc5cb" stroke="#8b9b98" stroke-width="2"/><path d="M1450,965 L1450,1370" fill="none" stroke="#7a8d88" stroke-width="3"/><path d="M2470,965 L2470,1370" fill="none" stroke="#7a8d88" stroke-width="3"/><text x="1910" y="925" font-size="22" fill="#30464a" text-anchor="middle">核心剖面：两层孔位相同，庭边留学习步台</text><text x="1400" y="1500" font-size="25" fill="#30464a" text-anchor="start">ROOF：各翼屋面/底面/采光构件</text><text x="1400" y="1543" font-size="25" fill="#30464a" text-anchor="start">EXTERIOR：四向墙壳/门窗/遮阳/连廊接口</text><text x="1400" y="1586" font-size="25" fill="#30464a" text-anchor="start">SLAB_F01/F02/F03：楼板独立，孔位共用</text><text x="1400" y="1629" font-size="25" fill="#30464a" text-anchor="start">INTERIOR_F01/F02/F03：房间内墙/顶面/家具</text><text x="1400" y="1672" font-size="25" fill="#30464a" text-anchor="start">STAIR_CORE：三梯/电梯空间，共轴分层</text><text x="1400" y="1715" font-size="25" fill="#30464a" text-anchor="start">OCCLUDER：视线侧墙与顶面可独立隐藏</text><text x="1400" y="1758" font-size="25" fill="#30464a" text-anchor="start">外壳内外只一套，不造重复共面墙</text><text x="1400" y="1801" font-size="25" fill="#30464a" text-anchor="start">共同SW原点/层高；不各自重置轴心</text><text x="1400" y="1844" font-size="25" fill="#30464a" text-anchor="start">分组资产就绪不等于运行隐藏/导航实现</text></g></svg>