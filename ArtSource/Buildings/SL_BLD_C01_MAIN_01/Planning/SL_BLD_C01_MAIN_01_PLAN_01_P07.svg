y="926" font-size="24" fill="#844e46" text-anchor="middle">P6·F3</text><text x="180" y="1250" font-size="25" fill="#30464a" text-anchor="start">DAILY_01 校门→鞋柜→二层玩家教室：纸面3D折线126.69m / XY125.57m</text><text x="180" y="1293" font-size="25" fill="#30464a" text-anchor="start">DAILY_02 玩家教室→北门→独立图书翼：纸面3D折线181.98m / XY180.86m</text><text x="180" y="1336" font-size="25" fill="#30464a" text-anchor="start">DAILY_03 玩家教室→东口→体育馆方向：纸面3D折线177.05m / XY175.93m</text><text x="180" y="1450" font-size="25" fill="#30464a" text-anchor="start">DAILY_03终点为体育馆门，非FIELD训练站位；后续训练场另沿既有室外路。</text><text x="180" y="1493" font-size="25" fill="#30464a" text-anchor="start">来访：主门→接待/职员侧；学生：鞋柜→年级梯→课堂；教职员：管理区与共用廊。</text><text x="180" y="1536" font-size="25" fill="#30464a" text-anchor="start">维护：东口授权时段→储物/竖井/设备，不穿教室；完全独立后勤路尚未成立。</text><text x="180" y="1579" font-size="25" fill="#30464a" text-anchor="start">P1入口照片、P2玩家年级厅、P3连接窗边、P4庭边、P5北门侧、P6许可露台。</text><image href="data:image/png;base64," x="140" y="1810" width="260" height="260" style="image-rendering:pixelated"/><text x="500" y="1810" font-size="25" fill="#30464a" text-anchor="start">原人物128²只读 / 约1.8m可见，约1.04m正面可见宽</text><text x="500" y="1853" font-size="25" fill="#30464a" text-anchor="start">胶囊1.92m高/0.68m直径另核；不缩人物或改镜头掩盖问题</text><text x="500" y="1896" font-size="25" fill="#30464a" text-anchor="start">教室门1.6×2.6m，主门3m；走廊3.6m允许停留退出主线</text><text x="500" y="1939" font-size="25" fill="#30464a" text-anchor="start">梯跑2.2m不代表拥挤相向/扶栏后一定可通；人物试作待核</text><text x="500" y="1982" font-size="25" fill="#30464a" text-anchor="start">桌0.65×0.45m/高0.72，椅高0.43；窗台1m，栏杆1.2m候选</text><text x="500" y="2025" font-size="25" fill="#30464a" text-anchor="start">当前是数据/比例规划，未进行真实相机、碰撞或自然光验证</text></g></svg>